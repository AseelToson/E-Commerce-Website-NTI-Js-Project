<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <!-- icons  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../Css/register.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="register-section">
      <div class="register-container">
        <div class="register-header">
          <div class="register-header-icon">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2>Create Your Account</h2>
        </div>

        <form action="" id="registerForm">
          <div class="form-item">
            <label for="fName">First Name</label>
            <div class="input-box">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                name="fName"
                id="fName"
                placeholder="Enter your first name"
                required
              />
            </div>

            <p id="error-fName"></p>
          </div>

          <div class="form-item">
            <label for="lName">Last Name</label>
            <div class="input-box">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                name="lName"
                id="lName"
                placeholder="Enter your last name"
                required
              />
            </div>
            <p id="error-lName"></p>
          </div>

          <div class="form-item">
            <label for="email">Email</label>
            <div class="input-box">
              <i class="fa-solid fa-at"></i>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <p id="error-email"></p>
          </div>

          <div class="form-item">
            <label>Phone</label>

            <div class="input-box">
              <i class="fa-solid fa-phone"></i>

              <input
                type="tel"
                id="phone"
                placeholder="Enter your phone"
                required
              />
            </div>
            <p id="error-phone"></p>
          </div>

          <div class="form-item">
            <label for="password">Password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="show-password" onclick="showPass()">
                <i class="fa-solid fa-eye" id="iconeye"></i>
              </button>
            </div>
            <p></p>
          </div>

          <div class="form-item">
            <label for="repassword">Repeat Password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                name="repassword"
                id="repassword"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="show-password"
                onclick="showPassrepete()"
              >
                <i class="fa-solid fa-eye" id="iconeye2"></i>
              </button>
            </div>
            <p id="error-repassword"></p>
          </div>

          <button type="submit" id="register">Register</button>
        </form>
        <p class="account-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/general.js"></script>
    <script src="../JS/register.js"></script>
  </body>
</html>
