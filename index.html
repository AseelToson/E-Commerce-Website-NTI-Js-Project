<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Amazon</title>


    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />


    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />


    <link rel="stylesheet" href="./Css/style.css" />
  </head>

  <body>

    <nav class="navbar navbar-dark store-navbar navbar-expand-lg">
      <div class="container-fluid">

        <a class="navbar-brand store-logo" href="./index.html"> Amazon </a>


        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="navbarContent">

          <form class="d-flex search-box">
            <input
              class="form-control"
              type="search"
              placeholder="Search products..."
              aria-label="Search"
            />

            <button class="btn search-btn" type="submit">
              <span class="material-symbols-outlined"> search </span>
            </button>
          </form>


          <div class="navbar-actions">
            <!-- Offers -->
            <a href="./Pages/offers.html" class="nav-action">
              <span class="material-symbols-outlined"> local_offer </span>

              <span>Offers</span>
            </a>


            <a href="./Pages/wishlist.html" class="nav-action">
              <span class="material-symbols-outlined"> favorite </span>

              <span>Wishlist</span>
            </a>


             <a href="./Pages/cart.html" class="nav-action cart-link">
               <span class="cart-icon">
                    <span class="material-symbols-outlined">
                     shopping_cart
                    </span>

                <span id="cartCount" class="cart-badge">0</span>
                </span>

                <span>Cart</span>



            <a href="./Pages/login.html" class="nav-action">
              <span class="material-symbols-outlined"> person </span>

              <span>Sign In</span>
            </a>

            <!-- Register -->
            <a href="./Pages/register.html" class="nav-action">
              <span class="material-symbols-outlined"> person_add </span>

              <span>Register</span>
            </a>
          </div>
        </div>
      </div>
    </nav>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./JS/home.js"></script>
  </body>
</html>
