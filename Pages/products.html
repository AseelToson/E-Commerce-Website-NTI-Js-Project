<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- General CSS -->

    <link rel="stylesheet" href="../Css/general.css" />

    <!-- Products CSS -->

    <link rel="stylesheet" href="../Css/products.css" />
  </head>

  <body>
    <!-- ================= Products ================= -->

    <main class="container py-5">
      <!-- Page Title -->

      <div class="text-center mb-5">
        <h1>Our Products</h1>

        <p class="text-muted">Discover our products</p>
      </div>

      <!-- ================= Category ================= -->

      <div class="row mb-4">
        <div class="col-md-4 mx-auto">
          <select id="categorySelect" class="form-select">
            <option value="">
              <!--//all -->
              All Categories
            </option>
          </select>
        </div>
      </div>

      <!-- ================= Products Container ================= -->

      <div id="productsContainer" class="row g-4">
        <!--
                JavaScript will create
                the product cards here
            -->
      </div>

      <!-- ================= Pagination ================= -->

      <div id="pagination" class="d-flex justify-content-center mt-5"></div>

      <!-- ================= No Products ================= -->

      <div id="noProducts" class="text-center d-none mt-5">
        <h3>No products found</h3>

        <p class="text-muted">Try another search.</p>
      </div>
    </main>

    

    <!-- ================= Bootstrap JS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/general.js"></script>

    <!-- ================= Products JS ================= -->

    <script type="module" src="../JS/products.js"></script>
  </body>
</html>
